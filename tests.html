<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Sanity Tests — SkillSync AI</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="card" style="padding: 28px; max-width: 820px; margin: 0 auto;">
        <div class="ai-mini-badge">Node-Free Client Test Runner</div>
        <h1 style="margin: 8px 0 6px;">SkillSync AI Diagnostic, Gate &amp; Engine Sanity Checks</h1>
        <p class="card-sub" style="margin-bottom: 18px;">
          Verifies <code>getLevel(easyCorrect, hardCorrect)</code>, <code>isGateCleared(state)</code>,
          legacy migration, profile edit gate rules, and verified override logic directly in the browser.
        </p>
        <div id="test-summary" class="overall-pct-pill" style="display: inline-block; margin-bottom: 16px;">Running...</div>
        <ul id="test-results" class="roadmap-list"></ul>
      </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/engine.js"></script>
    <script>
      (async function () {
        const Engine = window.SkillPathEngine;
        const Questions = window.SkillSyncQuestions;
        const Storage = window.SkillPathStorage;
        const Data = window.SkillPathData;

        const cases = [];
        function assertEqual(name, actual, expected) {
          const passed = actual === expected;
          cases.push({ name, actual, expected, passed });
        }

        // 1. Required getLevel() sanity checks
        assertEqual("getLevel(3, 2) -> 5/5 = Expert", Engine.getLevel(3, 2), "Expert");
        assertEqual("getLevel(3, 1) -> 4/5 with 3 easy = Intermediate", Engine.getLevel(3, 1), "Intermediate");
        assertEqual("getLevel(2, 1) -> 3/5 with 2 easy + 1 hard = Intermediate", Engine.getLevel(2, 1), "Intermediate");
        assertEqual("getLevel(1, 2) -> 3/5 with 1 easy + 2 hard = Beginner", Engine.getLevel(1, 2), "Beginner");
        assertEqual("getLevel(2, 0) -> 2/5 = Beginner", Engine.getLevel(2, 0), "Beginner");
        assertEqual("getLevel(0, 0) -> 0/5 = Beginner", Engine.getLevel(0, 0), "Beginner");

        // 2. Verified percentage mapping checks
        assertEqual("Beginner -> 30%", Engine.getLevelPct("Beginner"), 30);
        assertEqual("Intermediate -> 60%", Engine.getLevelPct("Intermediate"), 60);
        assertEqual("Expert -> 90%", Engine.getLevelPct("Expert"), 90);

        // 3. Verified level overrides self-rated score in analyzeProfile()
        const analysis = Engine.analyzeProfile(
          {
            name: "Test User",
            targetRole: "junior_data_analyst",
            companyPriority: "Dashboards",
            skillScores: { sql: 80, power_bi: 40, statistics: 55 },
            weeklyHours: "5-10",
            experience: "0-1",
          },
          {},
          {
            currentEmployeeId: "emp_test",
            verifiedLevelsOverride: {
              sql: { level: "Beginner", score: 2, verifiedPct: 30 },
              power_bi: { level: "Expert", score: 5, verifiedPct: 90 },
            },
            priorities: [{ skillId: "power_bi", weight: 5 }],
          }
        );
        const sqlItem = analysis.roadmap.find((s) => s.skillId === "sql");
        const pbiItem = analysis.roadmap.find((s) => s.skillId === "power_bi");
        const statItem = analysis.roadmap.find((s) => s.skillId === "statistics");

        assertEqual("Verified Beginner overrides SQL 80% -> 30%", sqlItem.effectivePct, 30);
        assertEqual("Verified Expert overrides Power BI 40% -> 90%", pbiItem.effectivePct, 90);
        assertEqual("Untested Statistics keeps self-rated 55%", statItem.effectivePct, 55);
        assertEqual("Untested Statistics marked Unverified", statItem.isVerified, false);

        // 4. Question bank coverage check
        const allCatalogCovered = Data.SKILLS_CATALOG.every((s) =>
          Questions.hasQuestions(s.id)
        );
        assertEqual("Every catalog skill has 3 easy + 2 hard offline questions", allCatalogCovered, true);

        // 5. Mandatory-diagnostic gate checks: isGateCleared(state)
        assertEqual(
          "isGateCleared: empty/no skills tested = false",
          Engine.isGateCleared({
            activeRole: "employee",
            gate: { required: [], completed: [], cleared: false },
          }),
          false
        );
        assertEqual(
          "isGateCleared: required skills with 0 tested = false",
          Engine.isGateCleared({
            activeRole: "employee",
            gate: { required: ["sql", "power_bi"], completed: [], cleared: false },
          }),
          false
        );
        assertEqual(
          "isGateCleared: some tested (1 of 2) = false",
          Engine.isGateCleared({
            activeRole: "employee",
            gate: { required: ["sql", "power_bi"], completed: ["sql"], cleared: false },
          }),
          false
        );
        assertEqual(
          "isGateCleared: all tested (2 of 2) = true",
          Engine.isGateCleared({
            activeRole: "employee",
            gate: { required: ["sql", "power_bi"], completed: ["sql", "power_bi"], cleared: true },
          }),
          true
        );
        assertEqual(
          "isGateCleared: new skill added = false again",
          Engine.isGateCleared({
            activeRole: "employee",
            gate: {
              required: ["sql", "power_bi", "python"],
              completed: ["sql", "power_bi"],
              cleared: false,
            },
          }),
          false
        );
        assertEqual(
          "isGateCleared: Manager role bypasses gate even with 0 tested",
          Engine.isGateCleared({
            activeRole: "manager",
            gate: { required: ["sql", "power_bi"], completed: [], cleared: false },
          }),
          true
        );
        assertEqual(
          "isGateCleared: HR role bypasses gate even with 0 tested",
          Engine.isGateCleared({
            activeRole: "hr",
            gate: { required: ["sql", "power_bi"], completed: [], cleared: false },
          }),
          true
        );

        // 6. Storage migration + saveProfile + recordTestAttempt integration (preserving existing localStorage)
        const backupV2 = window.localStorage.getItem("skillsync_ai_state_v2");
        const backupV1 = window.localStorage.getItem("skillsync_ai_state_v1");
        try {
          window.localStorage.removeItem("skillsync_ai_state_v2");
          window.localStorage.setItem(
            "skillsync_ai_state_v1",
            JSON.stringify({
              schemaVersion: 2,
              activeRole: "employee",
              profile: {
                name: "Legacy User",
                targetRole: "junior_data_analyst",
                selectedSkills: ["sql", "power_bi"],
              },
              verifiedLevels: { sql: { level: "Expert", verifiedPct: 90 } },
            })
          );
          const migrated = Storage.readLocal();
          assertEqual(
            "Migration: legacy v2 user treated as gate not cleared",
            Engine.isGateCleared(migrated),
            false
          );
          assertEqual(
            "Migration: legacy profile skills copied to gate.required",
            migrated.gate.required.join(","),
            "sql,power_bi"
          );

          // Complete both skills (even Beginner passes the gate)
          await Storage.recordTestAttempt("emp_current", "sql", {
            date: new Date().toISOString(),
            score: 1,
            easyCorrect: 1,
            hardCorrect: 0,
            level: "Beginner",
            verifiedPct: 30,
            tabSwitchCount: 0,
          });
          let stAfterOne = Storage.readLocal();
          assertEqual(
            "Gate stays locked after 1 of 2 completed",
            Engine.isGateCleared(stAfterOne),
            false
          );

          await Storage.recordTestAttempt("emp_current", "power_bi", {
            date: new Date().toISOString(),
            score: 4,
            easyCorrect: 3,
            hardCorrect: 1,
            level: "Intermediate",
            verifiedPct: 60,
            tabSwitchCount: 1,
          });
          let stAfterTwo = Storage.readLocal();
          assertEqual(
            "Gate unlocks after all selected skills completed (including Beginner)",
            Engine.isGateCleared(stAfterTwo),
            true
          );

          // Adding a new skill locks gate again; removing drops requirement
          await Storage.saveProfile({
            ...stAfterTwo.profile,
            selectedSkills: ["sql", "power_bi", "statistics"],
          });
          assertEqual(
            "Adding new skill locks gate again",
            Engine.isGateCleared(Storage.readLocal()),
            false
          );

          await Storage.saveProfile({
            ...stAfterTwo.profile,
            selectedSkills: ["sql", "power_bi"],
          });
          assertEqual(
            "Removing untested skill drops requirement and restores cleared gate",
            Engine.isGateCleared(Storage.readLocal()),
            true
          );

          // 7. UserType options, migration & validation checks
          assertEqual(
            "Catalog STATUS_OPTIONS has exactly 2 user types (employee, other)",
            Data.STATUS_OPTIONS.map((o) => o.id).join(","),
            "employee,other"
          );

          if (window.location.protocol === "http:" || window.location.protocol === "https:") {
            const indexResp = await window.fetch("index.html");
            const indexHtml = await indexResp.text();
            const parsedDoc = new DOMParser().parseFromString(indexHtml, "text/html");
            const userTypeOpts = Array.from(
              parsedDoc.querySelectorAll("#select-user-type option")
            ).map((opt) => opt.value);
            assertEqual(
              "index.html userType selector has exactly 2 options (employee,other)",
              userTypeOpts.join(","),
              "employee,other"
            );
            assertEqual(
              "index.html userType selector defaults to employee",
              parsedDoc.querySelector("#select-user-type option[selected]")?.value,
              "employee"
            );
          }

          window.localStorage.removeItem("skillsync_ai_state_v2");
          window.localStorage.setItem(
            "skillsync_ai_state_v2",
            JSON.stringify({
              schemaVersion: 3,
              activeRole: "employee",
              profile: {
                name: "Legacy Switcher",
                userType: "student",
                status: "student",
                targetRole: "junior_data_analyst",
                companyPriority: "Dashboards",
                selectedSkills: ["sql"],
              },
              gate: { required: ["sql"], completed: [], cleared: false },
            })
          );
          const migratedStudent = Storage.readLocal();
          assertEqual(
            "Migration converts userType 'student' to 'other'",
            migratedStudent.profile.userType,
            "other"
          );
          assertEqual(
            "Migration preserves rest of profile data (name)",
            migratedStudent.profile.name,
            "Legacy Switcher"
          );

          window.localStorage.setItem(
            "skillsync_ai_state_v2",
            JSON.stringify({
              schemaVersion: 3,
              activeRole: "employee",
              profile: {
                name: "Unknown Type User",
                userType: "unknown_role",
                targetRole: "junior_data_analyst",
                selectedSkills: ["sql"],
              },
              gate: { required: ["sql"], completed: [], cleared: false },
            })
          );
          assertEqual(
            "Migration converts unknown userType to 'other'",
            Storage.readLocal().profile.userType,
            "other"
          );

          let rejectedStudent = false;
          try {
            await Storage.saveProfile({
              name: "Invalid User",
              userType: "student",
              targetRole: "junior_data_analyst",
              selectedSkills: ["sql"],
            });
          } catch (_err) {
            rejectedStudent = true;
          }
          assertEqual("Saving userType 'student' fails", rejectedStudent, true);

          let rejectedInvalid = false;
          try {
            await Storage.saveProfile({
              name: "Invalid User",
              userType: "contractor_invalid",
              targetRole: "junior_data_analyst",
              selectedSkills: ["sql"],
            });
          } catch (_err) {
            rejectedInvalid = true;
          }
          assertEqual("Saving unknown userType fails", rejectedInvalid, true);

          await Storage.saveProfile({
            name: "New Joiner",
            userType: "other",
            previousField: "Retail",
            targetRole: "junior_data_analyst",
            companyPriority: "Dashboards",
            skillScores: { sql: 80, power_bi: 40, statistics: 55 },
            selectedSkills: ["sql"],
          });
          const otherSaved = Storage.readLocal();
          assertEqual(
            "Saving userType 'other' persists userType and previousField",
            `${otherSaved.profile.userType}:${otherSaved.profile.previousField}`,
            "other:Retail"
          );

          const otherAnalysis = Engine.analyzeProfile(otherSaved.profile, {}, otherSaved);
          const pbiCourseWhy =
            otherAnalysis.roadmap.find((s) => s.skillId === "power_bi")?.courses[0]
              ?.whyRecommended || "";
          assertEqual(
            "Why-this-course mentions non-tech background / fundamentals for 'other'",
            pbiCourseWhy.toLowerCase().includes("fundamentals") &&
              pbiCourseWhy.includes("Retail"),
            true
          );

          // 8. Course Certifications & Manager Notifications sanity checks
          window.localStorage.removeItem("skillsync_ai_state_v2");
          await Storage.saveProfile({
            name: "Priya S.",
            userType: "employee",
            targetRole: "junior_data_analyst",
            companyPriority: "Dashboards",
            skillScores: { sql: 80, power_bi: 40, statistics: 55 },
            selectedSkills: ["sql", "power_bi", "statistics"],
          });

          const initialCertCount = Storage.getCertificationCount("emp_current");
          assertEqual("Initial employee certification count is 0", initialCertCount, 0);

          // Completing a certified course adds exactly 1 certification and 1 manager notification
          await Storage.setCourseStatus("mslearn-powerbi-start", "completed");
          await Storage.addCertification({
            employeeId: "emp_current",
            courseId: "mslearn-powerbi-start",
            certificationName: "Microsoft Power BI Data Analyst Certificate",
            certId: "MS-PBI-2026-999",
            completedOn: "2026-11-27",
          });
          await Storage.notifyManager({
            employeeId: "emp_current",
            employeeName: "Priya S.",
            courseId: "mslearn-powerbi-start",
            courseTitle: "Power BI Essentials: Get Started Building with Power BI",
            certificationName: "Microsoft Power BI Data Analyst Certificate",
            completedOn: "2026-11-27",
          });

          let certState = Storage.readLocal();
          const certNotificationsAfterFirst = certState.notifications.filter(
            (n) => n.type === "certification_completed"
          );
          assertEqual(
            "getCertificationCount updates to 1 after completing certified course",
            Storage.getCertificationCount("emp_current"),
            1
          );
          assertEqual(
            "Completing certified course creates 1 manager notification",
            certNotificationsAfterFirst.length,
            1
          );
          assertEqual(
            "Manager notification includes employee name and certification name",
            certNotificationsAfterFirst[0].message.includes("Priya S.") &&
              certNotificationsAfterFirst[0].message.includes("Microsoft Power BI Data Analyst Certificate"),
            true
          );

          // Completing a non-certified course adds neither certification nor notification
          await Storage.setCourseStatus("mslearn-powerbi-dashboards", "completed");
          assertEqual(
            "Completing non-certified course keeps certification count at 1",
            Storage.getCertificationCount("emp_current"),
            1
          );
          assertEqual(
            "Completing non-certified course adds 0 new manager notifications",
            Storage.readLocal().notifications.filter((n) => n.type === "certification_completed").length,
            1
          );

          // Completing the same certified course again (reset -> complete) updates instead of double counting
          await Storage.setCourseStatus("mslearn-powerbi-start", "not_started");
          await Storage.setCourseStatus("mslearn-powerbi-start", "completed");
          await Storage.addCertification({
            employeeId: "emp_current",
            courseId: "mslearn-powerbi-start",
            certificationName: "Microsoft Power BI Data Analyst Certificate",
            certId: "MS-PBI-2026-UPDATED",
            completedOn: "2026-11-27",
          });
          assertEqual(
            "Completing same certified course twice does not double count",
            Storage.getCertificationCount("emp_current"),
            1
          );
          assertEqual(
            "Re-completing certified course updates existing certId",
            Storage.getCertifications("emp_current")[0].certId,
            "MS-PBI-2026-UPDATED"
          );

          // Verifying certification updates verified count
          await Storage.verifyCertification("emp_current", "mslearn-powerbi-start");
          assertEqual(
            "verifyCertification updates verified count to 1",
            Storage.getVerifiedCertificationCount("emp_current"),
            1
          );

          // Anonymised names hide real name in HR notifications
          const hrAnonState = {
            ...Storage.readLocal(),
            activeRole: "hr",
            anonymiseHR: true,
          };
          const anonMsg = Engine.formatNotificationMessage(
            hrAnonState.notifications.find((n) => n.type === "certification_completed"),
            hrAnonState
          );
          assertEqual(
            "Anonymised HR notification hides real employee name and shows Employee #01",
            !anonMsg.includes("Priya S.") && anonMsg.includes("Employee #01"),
            true
          );

          // Seeded employees include 0 to 3 certifications
          assertEqual(
            "Seeded employee Maya has 2 certifications",
            Storage.getCertificationCount("emp_maya"),
            2
          );
          assertEqual(
            "Seeded employee Hana has 3 certifications",
            Storage.getCertificationCount("emp_hana"),
            3
          );
        } finally {
          window.localStorage.removeItem("skillsync_ai_state_v2");
          window.localStorage.removeItem("skillsync_ai_state_v1");
          if (backupV2 !== null) window.localStorage.setItem("skillsync_ai_state_v2", backupV2);
          if (backupV1 !== null) window.localStorage.setItem("skillsync_ai_state_v1", backupV1);
        }

        const passedCount = cases.filter((c) => c.passed).length;
        const summaryEl = document.getElementById("test-summary");
        summaryEl.textContent = `${passedCount} / ${cases.length} Passed`;
        summaryEl.style.background = passedCount === cases.length ? "var(--strong-bg)" : "var(--missing-bg)";
        summaryEl.style.color = passedCount === cases.length ? "var(--strong-fg)" : "var(--missing-fg)";

        document.getElementById("test-results").innerHTML = cases
          .map(
            (c) => `
          <li class="roadmap-step ${c.passed ? "status-border-strong" : ""}">
            <span class="roadmap-step-num ${c.passed ? "status-dot-strong" : "status-dot-missing"}">${c.passed ? "✓" : "✕"}</span>
            <div class="roadmap-step-body">
              <strong>${c.name}</strong>
              <div class="muted-note">Expected: ${String(c.expected)} · Actual: ${String(c.actual)}</div>
            </div>
          </li>
        `
          )
          .join("");
      })();
    </script>
  </body>
</html>
